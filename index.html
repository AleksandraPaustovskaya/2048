<!doctype html>

  <body>
    <div id="app">
      <div class = "gameWrapper">

          <div class = "game__control-panel">
            <button class = "newGame btn">новая игра</button>
            <div class="game__score">
              <div class="score">current: <span class="current">1</span></div>

            </div>
          </div>

    <!-- <script type="module" src="/src/main.js"></script> -->
          <div class="game-field">

                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
              </div>

                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
              </div>
              <div class="grid-row">
                <div class="grid-cell"></div>
                <div class="grid-cell">scz x</div>
                <div class="grid-cell">zvfs</div>

              </div>
            </div>
           <div class="game_tiles"><!--элемент внутри которого будут отображаться -->
           </div>
          </div>
        </div>
      </div>

    </div>
